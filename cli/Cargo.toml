[package]
name = "hydro-cli"
version = "0.1.0"
edition = "2021"
description = "水利计算 JSON CLI 后端 — vendored 自作者上游 hydro 项目的纯 Rust 计算核,供 SwiftUI 前端经 Process 调用"

[[bin]]
name = "hydro-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rust_xlsxwriter = "0.79"

[profile.release]
strip = true
opt-level = "z"
lto = true
